<text x="35" y="740" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">Dominio futuro requiere rutas, migraciones y pruebas propias. No crear tablas anticipadamente.</text>
<text x="35" y="833" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Continua: interfaz definida. Discontinua: propuesta pendiente. Colores identifican dominios.</text>
