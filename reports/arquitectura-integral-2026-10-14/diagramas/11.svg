<text x="520" y="946" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">users 1 → N profiles; users 1 → N audit_log [P]</text>
<text x="520" y="974" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">No migraciones nuevas aplicadas por este documento.</text>
<text x="35" y="1033" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Todas las cajas [P] son propuestas de diseño. Cardinalidades y campos detallados en sección 12.</text>
<text x="35" y="1060" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Azul hardware | Verde software | Naranja red | Morado datos | Rojo seguridad | Gris externo</text>
