<text x="520" y="847" font-family="Arial" font-size="22" font-weight="bold" text-anchor="start" fill="#17212B">FK adicionales mediante conectores de referencia</text>
<text x="520" y="890" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">devices 1 → N config / events / alerts / credentials</text>
