<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="53" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#17212B">Figura 8  Máquina de estados de dosificación</text>
<rect x="35" y="170" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="47" y="202" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">DISABLED</text>
<rect x="405" y="170" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="417" y="202" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">READY</text>
<rect x="775" y="170" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="787" y="202" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">MEASURING</text>
<rect x="1145" y="170" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="1157" y="202" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">VALIDATING</text>
<rect x="35" y="470" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="47" y="502" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">DOSING</text>
<rect x="405" y="470" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="417" y="502" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">MIXING</text>
<rect x="775" y="470" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="787" y="502" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">WAITING</text>
<rect x="1145" y="470" width="285" height="110" rx="8" fill="#DCEAF7" stroke="#526371" stroke-width="2"/>
<text x="1157" y="502" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">VERIFYING</text>
<polyline points="320,225 405,225" fill="none" stroke="#435B6E" stroke-width="3"/>
<polygon points="405,225 393.0,220.0 393.0,230.0" fill="#435B6E"/>
<rect x="322" y="143" width="73" height="19" fill="white"/>
<text x="325" y="160" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Habilitar</text>
<polyline points="690,225 775,225" fill="none" stroke="#435B6E" stroke-width="3"/>
<polygon points="775,225 763.0,220.0 763.0,230.0" fill="#435B6E"/>
<rect x="692" y="143" width="46" height="19" fill="white"/>
<text x="695" y="160" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Ciclo</text>
<polyline points="1060,225 1145,225" fill="none" stroke="#435B6E" stroke-width="3"/>
<polygon points="1145,225 1133.0,220.0 1133.0,230.0" fill="#435B6E"/>
<rect x="1062" y="143" width="118" height="19" fill="white"/>
<text x="1065" y="160" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Lectura válida</text>
<polyline points="320,525 405,525" fill="none" stroke="#435B6E" stroke-width="3"/>
<polygon points="405,525 393.0,520.0 393.0,530.0" fill="#435B6E"/>
<rect x="322" y="443" width="138" height="19" fill="white"/>
<text x="325" y="460" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Cerrar / dosis fin</text>
<polyline points="690,525 775,525" fill="none" stroke="#435B6E" stroke-width="3"/>
<polygon points="775,525 763.0,520.0 763.0,530.0" fill="#435B6E"/>
<rect x="692" y="443" width="141" height="23" fill="white"/>
<text x="695" y="460" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Mezcla completa</text>
<polyline points="1060,525 1145,525" fill="none" stroke="#435B6E" stroke-width="3"/>
<polygon points="1145,525 1133.0,520.0 1133.0,530.0" fill="#435B6E"/>
<rect x="1061" y="443" width="117" height="19" fill="white"/>
<text x="1065" y="460" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Asentamiento</text>
<polyline points="1287,280 1287,335 15,335 15,525 35,525" fill="none" stroke="#435B6E" stroke-width="3"/>
<polygon points="35,525 23.0,520.0 23.0,530.0" fill="#435B6E"/>
<rect x="557" y="308" width="182" height="19" fill="white"/>
<text x="560" y="325" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Corrección autorizada</text>
<rect x="35" y="700" width="655" height="125" rx="8" fill="#F9DEDE" stroke="#526371" stroke-width="2"/>
<text x="47" y="732" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">LOCKOUT</text>
<text x="47" y="758" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">Cerrar todos; nivel / límites / calibración / permiso</text>
<rect x="800" y="700" width="655" height="125" rx="8" fill="#F9DEDE" stroke="#526371" stroke-width="2"/>
<text x="812" y="732" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#17212B">FAULT</text>
<text x="812" y="758" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">Cerrar todos; driver / sensor / timeout interno</text>
<text x="35" y="650" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">VERIFYING → READY si objetivo satisfecho; → MEASURING si otra corrección está permitida.</text>
<text x="35" y="875" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">Cualquier estado entra LOCKOUT o FAULT ante su causa; el cierre precede al registro.</text>
<text x="35" y="920" font-family="Arial" font-size="20" font-weight="normal" text-anchor="start" fill="#17212B">LOCKOUT/FAULT → DISABLED tras diagnóstico. Reinicio nunca retoma una dosis.</text>
<text x="35" y="993" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Eventos y guardas completos en sección 10. Estados de diseño; no firmware de actuadores ejecutado.</text>
<text x="35" y="1020" font-family="Arial" font-size="18" font-weight="normal" text-anchor="start" fill="#17212B">Azul hardware | Verde software | Naranja red | Morado datos | Rojo seguridad | Gris externo</text>
</svg>