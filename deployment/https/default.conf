# HydroMate-only TLS endpoint. No HTTP listener or automatic ACME on 80/443.
server {
    listen 9443 ssl;
    server_name _;
    ssl_certificate /etc/hydromate/tls/fullchain.pem;
    ssl_certificate_key /etc/hydromate/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hydromate_upstream api:8080;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    location = /up {
        limit_except GET { deny all; }
        proxy_pass http://$hydromate_upstream;
    }

    # The only public write asks a known tower to acquire telemetry; no payload,
    # actuator command or public measurement insertion is accepted by Laravel.
    location ~ "^/api/devices/[A-Za-z0-9_-]{1,64}/measurement-requests$" {
        limit_except POST { deny all; }
        proxy_pass http://$hydromate_upstream;
    }

    location ~ "^/api/measurement-requests/[0-9a-fA-F-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://$hydromate_upstream;
    }

    # Only the private bridge may insert measurements; internal routes stay private.
    location ~ "^/api/(measurements(/latest)?|devices/[A-Za-z0-9_-]{1,64}/status)$" {
        limit_except GET { deny all; }
        proxy_pass http://$hydromate_upstream;
    }

    location / { return 404; }
}
