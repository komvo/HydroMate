per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Private container network only; this listener is never published to the host.
listener 1884

# ESP32 Internet endpoint; administrator supplies its certificate/private key.
listener 8884
certfile /mosquitto/secrets/fullchain.pem
keyfile /mosquitto/secrets/privkey.pem
tls_version tlsv1.2
